# ==============================================================
# 1. C?U HÌNH SERVER
# ==============================================================
server.port=8083
server.servlet.session.timeout=30m

# ==============================================================
# 2. C?U HÌNH QU?N LÝ PHIÊN (SPRING SESSION REDIS)
# ==============================================================
spring.session.store-type=redis
# ??y d? li?u xu?ng Redis ngay l?p t?c
spring.session.redis.flush-mode=immediate
# Namespace giúp b?n phân bi?t các session c?a t?ng ?ng d?ng trong Redis
spring.session.redis.namespace=spring:session:demo

# ==============================================================
# 3. C?U HÌNH C? S? D? LI?U (MYSQL DOCKER)
# ==============================================================
# S? d?ng 127.0.0.1:3309 ?úng theo Docker mapping
spring.datasource.url=jdbc:mysql://127.0.0.1:3309/demo_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ==============================================================
# 4. C?U HÌNH K?T N?I REDIS DOCKER (PORT 6380)
# ==============================================================
spring.data.redis.host=127.0.0.1
# B?T BU?C dùng 6380 ?? k?t n?i vào Docker Container
spring.data.redis.port=6380
spring.data.redis.timeout=5000
# Thêm m?t kh?u n?u có (Docker c?a b?n hi?n t?i không ?? pass nên ?? tr?ng)
spring.data.redis.password=

# ==============================================================
# 5. C?U HÌNH B? NH? ??M (CACHE)
# ==============================================================
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# ==============================================================
# 6. LOGGING DEBUG
# ==============================================================
logging.level.org.springframework.session.redis=DEBUG
logging.level.org.springframework.data.redis=DEBUG
# Giúp b?n th?y IP nào ?ang b? ch?n ngay trên console IntelliJ
logging.level.com.example.demo=DEBUG