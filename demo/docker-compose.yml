version: '3.8'
services:
  # Cấu hình MySQL
  mysql-db:
    image: mysql:8.0
    container_name: mysql-container
    ports:
      - "3309:3306"
    environment:
      MYSQL_DATABASE: demo_db
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - mysql_data:/var/lib/mysql

  # Cấu hình Redis
  redis-cache:
    image: redis:latest
    container_name: redis-container
    ports:
      - "6380:6379"

volumes:
  mysql_data: